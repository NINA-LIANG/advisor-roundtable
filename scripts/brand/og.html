<!doctype html>
<!-- 分享卡片 og.png 的原稿：用瀏覽器以 1200×630 截圖，輸出到 web/og.png -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(160deg,#fff7ef 0%,#ffe9ef 60%,#fff4e4 100%);color:#4a3b32;font-family:"Huninn","WenQuanYi Zen Hei","PingFang TC",sans-serif;
  display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box;gap:26px;position:relative}
.logo{display:flex;align-items:center;gap:22px;font-size:34px;color:#7a675a}
.logo img{width:84px;height:84px}
h1{margin:0;font-weight:400;font-size:118px;letter-spacing:.06em;line-height:1}
p{margin:0;font-size:40px;line-height:1.45;max-width:20em}
.tags{display:flex;gap:14px;font-size:28px}
.tags span{background:#fffdfa;border:3px solid #f1e2d6;border-radius:999px;padding:6px 22px}
.dots{position:absolute;right:70px;top:70px;display:grid;grid-template-columns:repeat(3,60px);gap:18px}
.dots i{width:60px;height:60px;border-radius:50%;display:block}
