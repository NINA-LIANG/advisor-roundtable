<title>台股全覽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 理專圓桌的姊妹頁，像一本台股電話簿。上方切「股票／ETF」→ 篩選列 → 清單（分頁）→ 點一檔在右側（手機在下方）展開詳情：ETF 看內容物與產業分布，股票看哪些 ETF 持有它。只做淺色主題。 */
:root{
  color-scheme:light;
  --bg:#fff7ef; --card:#fffdfa; --ink:#4a3b32; --ink-soft:#7a675a; --line:#f1e2d6;
  --pink:#f7b7c5; --pink-deep:#c13357; --apricot:#ffd9a0; --apricot-deep:#8f621f;
  --matcha:#c5ddb0; --matcha-deep:#4c7439; --sky:#b5d8f2; --sky-deep:#3d6f94; --lilac:#d9cdf2;
  --up:#d9534f; --down:#3f8f4f;
  --shadow:0 6px 0 rgba(74,59,50,.06),0 12px 28px rgba(217,112,138,.12);
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(175deg,var(--bg) 0%,#eef6ff 70%,#fff4e4 100%);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:22px}
p{margin:0}
.box{background:var(--card);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:18px;min-width:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px}
.muted{color:var(--ink-soft)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-soft)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
header h1{font-size:clamp(28px,5vw,42px)}
header p{margin-top:4px;color:var(--ink-soft)}
.links{display:flex;gap:14px;flex-wrap:wrap}
.links a{color:var(--sky-deep);font-weight:700}
a{color:var(--sky-deep)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--line);border-radius:22px;overflow:hidden;background:#f5faff}
.stats>div{padding:10px 16px;border-right:2px dashed var(--line);min-width:0}
.stats>div:last-child{border-right:none}
.stats b{display:block;font-family:var(--f-mono);font-weight:500;font-size:clamp(20px,3vw,28px);line-height:1.3}
.stats small{font-size:13px;color:var(--ink-soft)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}.stats>div:nth-child(2){border-right:none}.stats>div:nth-child(-n+2){border-bottom:2px dashed var(--line)}}

.tabs{display:flex;gap:8px}
.tab{border:2px solid var(--line);background:#fff9f4;border-radius:999px;padding:6px 18px;font-size:16px;font-family:var(--f-display)}
.tab[aria-selected="true"]{background:var(--apricot);border-color:var(--apricot-deep)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.search{background:#fff9f4;border:2px solid var(--line);border-radius:999px;padding:6px 14px;flex:1 1 220px;min-width:0;max-width:360px}
select{background:#fff9f4;border:2px solid var(--line);border-radius:999px;padding:6px 12px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:2px solid var(--line);background:#fff9f4;border-radius:999px;padding:3px 11px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky-deep);font-weight:700}
.chip small{color:var(--ink-soft);font-family:var(--f-mono);margin-left:4px}

.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1.5px dashed var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--ink-soft);font-weight:700;position:sticky;top:0;background:var(--card)}
th button{border:none;background:none;padding:0;font-weight:700;color:inherit}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fff4e8}
tbody tr[aria-selected="true"]{background:#e8f3fc}
.code{font-family:var(--f-mono);color:var(--ink-soft)}
/* 手機上先收起產業／類型欄，讓收盤與漲跌不用左右滑就看得到 */
@media (max-width:520px){#tbl th:nth-child(3),#tbl td:nth-child(3){display:none}}
.up{color:var(--up)} .down{color:var(--down)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;background:var(--lilac)}
.tag.has{background:var(--matcha)}
.scroll{overflow-x:auto}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
.pager button{border:2px solid var(--line);background:#fff9f4;border-radius:999px;padding:3px 12px}
.pager button:disabled{opacity:.4;cursor:not-allowed}

.detail{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){.detail{position:static;max-height:none}}
.detail h2{font-size:24px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:#fff9f4;border-radius:14px;padding:6px 10px;min-width:0}
.kv small{display:block;font-size:12px;color:var(--ink-soft)}
.kv b{font-family:var(--f-mono);font-weight:500}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr) 4.2em;gap:8px;align-items:center;font-size:13.5px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:10px;border-radius:5px;background:var(--sky)}
.bar.sec i{background:var(--apricot)}
.bar em{font-style:normal;font-family:var(--f-mono);text-align:right}
.bar a{color:inherit;text-decoration:underline dotted}
.note{background:#f5faff;border-radius:16px;padding:8px 12px;font-size:13.5px}
.desc{font-size:14px;background:#fff9f4;border-radius:16px;padding:8px 12px}
.empty{padding:30px 10px;text-align:center;color:var(--ink-soft)}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px}
.active:empty{display:none}
.active button{border:none;background:var(--lilac);border-radius:999px;padding:2px 10px;font-size:13px}
.morecol{border:2px solid var(--line);background:#fff9f4;border-radius:999px;padding:2px 12px;font-size:13px}
table:not(.wide) .opt{display:none}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump a{border:2px solid var(--line);background:#fff9f4;border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:700;text-decoration:none}
.foot{font-size:13px;color:var(--ink-soft);text-align:center}
</style>

<div class="wrap">
  <!--SITE-NAV-->
  <header>
    <div>
      <div class="eyebrow">理專圓桌・姊妹頁</div>
      <h1>台股全覽 📇</h1>
      <p>上市、上櫃的每一檔股票和 ETF 都在這裡。點一檔 ETF 看它裡面裝了什麼，點一檔股票看它的財報、月營收，以及哪些 ETF 持有它。</p>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="box">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-stock" aria-selected="true">股票</button>
      <button class="tab" role="tab" id="t-etf" aria-selected="false">ETF</button>
    </div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="搜尋代號或名稱，例如 2330、台積電" aria-label="搜尋">
      <select id="mkt" aria-label="市場"><option value="">上市＋上櫃</option><option>上市</option><option>上櫃</option></select>
      <select id="sort" aria-label="排序"></select>
    </div>
    <div class="chips" id="cats"></div>
    <div class="active" id="active"></div>
  </section>

  <div class="main">
    <section class="box list" aria-label="清單">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="muted" id="count" style="font-size:13.5px"></div><button class="morecol" type="button" id="morecol" aria-pressed="false">更多欄位</button></div>
      <div class="scroll"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      <div class="pager" id="pager"></div>
    </section>
    <aside class="box detail" id="detail" aria-live="polite"></aside>
  </div>

  <p class="foot">股票與 ETF 清單：證交所、櫃買中心開放資料（<span id="asof"></span>，平日自動更新）。ETF 持股：MoneyDJ 整理的投信公告（<span id="hasof"></span>，每週更新）。非投資建議。</p>
</div>

<script>
const U=/*UNIVERSE*/, HD=/*HOLDINGS*/, FIN=/*FIN*/;
const H=HD.etfs||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>v==null?"—":v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const S=U.stock.map(r=>({code:r[0],name:r[1],mkt:r[2],cat:r[3],p:r[4],chg:r[5],tv:r[6],yr:r[7],cap:r[8]}));
const E=U.etf.map(r=>({code:r[0],name:r[1],mkt:r[2],cat:r[3],p:r[4],chg:r[5],tv:r[6]}));
const byName=Object.fromEntries(S.map(s=>[s.name,s]));
const MDJ=c=>`https://www.moneydj.com/ETF/X/Basic/Basic0007a.xdjhtm?etfid=${encodeURIComponent(c)}.TW`;

// 反查：股票名稱 → 持有它的 ETF
const OWN={};
for(const [code,e] of Object.entries(H)) for(const [n,w] of (e.h||[])) (OWN[n]=OWN[n]||[]).push([code,w]);
for(const k in OWN) OWN[k].sort((a,b)=>b[1]-a[1]);
const etfBy=Object.fromEntries(E.map(e=>[e.code,e]));

$("stats").innerHTML=[["股票",S.length.toLocaleString()+" 檔"],["ETF",E.length+" 檔"],["已收錄 ETF 內容物",Object.keys(H).length+" 檔"],["資料日期",U.asof]].map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join("");
$("asof").textContent=U.asof;$("hasof").textContent=HD.asof||"—";

let mode="stock",cat="",page=0,sel=null;const PER=50;
const SORTS={stock:[["tv","成交值大到小"],["code","代號"],["chg","漲幅大到小"],["cap","股本大到小"],["own","被最多 ETF 持有"]],etf:[["tv","成交值大到小"],["code","代號"],["chg","漲幅大到小"],["n","持股檔數多到少"]]};
function setMode(m){
  mode=m;cat="";page=0;sel=null;
  $("t-stock").setAttribute("aria-selected",m==="stock");$("t-etf").setAttribute("aria-selected",m==="etf");
  $("sort").innerHTML=SORTS[m].map(([v,t])=>`<option value="${v}">${t}</option>`).join("");
  $("q").placeholder=m==="stock"?"搜尋代號或名稱，例如 2330、台積電":"搜尋代號或名稱，例如 0050、高股息";
  render();detail();
}
function rows(){
  const q=$("q").value.trim().toLowerCase(),mk=$("mkt").value,src=mode==="stock"?S:E;
  let r=src.filter(x=>(!mk||x.mkt===mk)&&(!cat||x.cat===cat)&&(!q||x.code.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)));
  const k=$("sort").value;
  const val={tv:x=>-(x.tv||0),chg:x=>-((x.chg||0)/((x.p||1)-(x.chg||0))),cap:x=>-(x.cap||0),own:x=>-((OWN[x.name]||[]).length),n:x=>-((H[x.code]||{}).n||0)}[k];
  r.sort(val?(a,b)=>val(a)-val(b)||a.code.localeCompare(b.code):(a,b)=>a.code.localeCompare(b.code));
  // 搜尋時把代號完全相同的排第一
  if(q){const i=r.findIndex(x=>x.code.toLowerCase()===q);if(i>0)r.unshift(...r.splice(i,1))}
  return r;
}
function cats(){
  const src=mode==="stock"?S:E,c={};src.forEach(x=>c[x.cat]=(c[x.cat]||0)+1);
  const list=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  $("cats").innerHTML=`<button class="chip" data-c="" aria-pressed="${!cat}">全部</button>`+list.map(([k,n])=>`<button class="chip" data-c="${esc(k)}" aria-pressed="${cat===k}">${esc(k)}<small>${n}</small></button>`).join("");
}
function pct(x){if(x.p==null||x.chg==null)return "—";const base=x.p-x.chg;const v=base?x.chg/base*100:0;return `<span class="pc ${v>0?"up":v<0?"down":""}">${v>0?"+":""}${v.toFixed(2)}%</span>`}
function render(){
  cats();const r=rows(),pages=Math.max(1,Math.ceil(r.length/PER));page=Math.min(page,pages-1);
  $("count").textContent=`共 ${r.length.toLocaleString()} 檔`+(r.length>PER?`，第 ${page+1} / ${pages} 頁`:"");
  $("thead").innerHTML=mode==="stock"
    ?`<tr><th>代號</th><th class="stick">名稱</th><th>產業</th><th class="n">收盤</th><th class="n">漲跌</th><th class="n opt">成交值(億)</th><th class="n opt">ETF 持有</th></tr>`
    :`<tr><th>代號</th><th class="stick">名稱</th><th>類型</th><th class="n">收盤</th><th class="n">漲跌</th><th class="n opt">成交值(億)</th><th>內容物</th></tr>`;
  const mk=$("mkt").value,q=$("q").value.trim();
  $("active").innerHTML=[q&&["q",`搜尋「${esc(q)}」`],mk&&["mkt",mk],cat&&["cat",esc(cat)]].filter(Boolean).map(([k,t])=>`<button type="button" data-x="${k}" aria-label="清除 ${t}">已篩選：${t} ×</button>`).join("");
  const slice=r.slice(page*PER,page*PER+PER);
  $("tbody").innerHTML=slice.length?slice.map(x=>mode==="stock"
    ?`<tr data-k="${x.code}" aria-selected="${sel===x.code}"><td class="code">${x.code}</td><td class="stick"><b>${esc(x.name)}</b>${x.mkt==="上櫃"?' <span class="muted" style="font-size:12px">櫃</span>':""}</td><td>${esc(x.cat)}</td><td class="n">${fmt(x.p)}</td><td class="n">${pct(x)}</td><td class="n opt">${fmt(x.tv)}</td><td class="n opt">${(OWN[x.name]||[]).length||""}</td></tr>`
    :`<tr data-k="${x.code}" aria-selected="${sel===x.code}"><td class="code">${x.code}</td><td class="stick"><b>${esc(x.name)}</b>${x.mkt==="上櫃"?' <span class="muted" style="font-size:12px">櫃</span>':""}</td><td><span class="tag">${esc(x.cat)}</span></td><td class="n">${fmt(x.p)}</td><td class="n">${pct(x)}</td><td class="n opt">${fmt(x.tv)}</td><td>${H[x.code]?.h?.length?`<span class="tag has">${H[x.code].n} 檔</span>`:/槓桿|商品/.test(x.cat)?'<span class="muted" style="font-size:12px">期貨為主</span>':'<span class="muted" style="font-size:12px">待收錄</span>'}</td></tr>`).join("")
    :`<tr><td colspan="7" class="empty">找不到符合的標的，換個關鍵字或分類試試。</td></tr>`;
  $("pager").innerHTML=pages>1?`<button data-p="-1" ${page?"":"disabled"}>上一頁</button><span class="mono">${page+1} / ${pages}</span><button data-p="1" ${page<pages-1?"":"disabled"}>下一頁</button>`:"";
}
function bars(list,cls,link){
  const max=Math.max(...list.map(x=>x[1]||0),1);
  return `<div class="bars">${list.map(([n,w])=>{const s=link&&byName[n];return `<div class="bar ${cls}"><span title="${esc(n)}">${s?`<a href="#" data-go="stock:${s.code}">${esc(n)}</a>`:esc(n)}</span><i style="width:${Math.max(2,(w||0)/max*100)}%"></i><em>${w==null?"—":w.toFixed(2)+"%"}</em></div>`}).join("")}</div>`;
}
function ownBars(own){
  const max=Math.max(...own.map(x=>x[1]||0),1);
  return `<div class="bars">${own.map(([c,w])=>`<div class="bar"><span title="${esc(etfBy[c]?.name||c)}"><a href="#" data-go="etf:${c}">${c} ${esc(etfBy[c]?.name||"")}</a></span><i style="width:${Math.max(2,(w||0)/max*100)}%"></i><em>${w==null?"—":w.toFixed(2)+"%"}</em></div>`).join("")}</div>`;
}
// 財報：最新一季累計（億元），欄位順序看 FIN.cols
function finBlock(code){
  const r=FIN.fin?.[code],m=FIN.mrev?.[code];
  if(!r&&!m)return FIN.pending?`<h3>財務報表</h3><p class="muted">財報資料準備中，下一次每日更新後就會出現。</p>`:"";
  const v=Object.fromEntries((FIN.cols||[]).map((k,i)=>[k,r?.[i]??null]));
  const ratio=(a,b)=>a==null||!b?"—":(a/b*100).toFixed(1)+"%";
  const yi=x=>x==null?"—":fmt(x,x>=100||x<=-100?0:2)+" 億";
  const sg=x=>x==null?"—":`<span class="${x>0?"up":x<0?"down":""}">${x>0?"+":""}${x.toFixed(1)}%</span>`;
  const [y,q]=(FIN.quarter||"").split(" Q");
  return `<h3>財務報表 <small class="muted">${y?`${y} 年第 1～${q} 季累計`:""}</small></h3>
    ${r?`<div class="kv"><div><small>${v.gp==null&&v.ca==null?"淨收益":"營收"}</small><b>${yi(v.rev)}</b></div><div><small>毛利率</small><b>${ratio(v.gp,v.rev)}</b></div><div><small>營業利益率</small><b>${ratio(v.op,v.rev)}</b></div>
    <div><small>稅後淨利</small><b>${yi(v.np??v.net)}</b></div><div><small>EPS</small><b>${v.eps==null?"—":fmt(v.eps)+" 元"}</b></div><div><small>ROE（累計）</small><b>${ratio(v.np??v.net,v.eqp??v.eq)}</b></div>
    <div><small>總資產</small><b>${yi(v.assets)}</b></div><div><small>負債比</small><b>${ratio(v.liab,v.assets)}</b></div><div><small>流動比</small><b>${ratio(v.ca,v.cl)}</b></div>
    <div><small>每股淨值</small><b>${v.bvps==null?"—":fmt(v.bvps)+" 元"}</b></div></div>`:""}
    ${m?`<div class="kv"><div><small>${m[0].replace("-","/")} 月營收</small><b>${yi(m[1])}</b></div><div><small>月增</small><b>${sg(m[2])}</b></div><div><small>年增</small><b>${sg(m[3])}</b></div><div><small>今年累計營收</small><b>${yi(m[4])}</b></div><div><small>累計年增</small><b>${sg(m[5])}</b></div></div>`:""}
    <p class="note">來源：公開資訊觀測站彙總表（證交所、櫃買中心開放資料）。財報為今年累計數，ROE 未年化；銀行、保險等金融業沒有毛利與流動比。完整報表可到<a href="https://mops.twse.com.tw/mops/" target="_blank" rel="noopener">公開資訊觀測站</a>輸入代號 ${esc(code)} 查詢。</p>`;
}

function detail(){
  const d=$("detail");
  if(!sel){d.innerHTML=`<h2>${mode==="stock"?"選一檔股票":"選一檔 ETF"}</h2><p class="muted">${mode==="stock"?"點左邊清單的任一檔，會列出哪些 ETF 持有它、各放了多少比重。":"點左邊清單的任一檔，會列出它的持股明細與產業分布。"}</p><p class="note">💡 小技巧：ETF 的內容物裡，名字有底線的股票可以點，會直接跳到那檔股票。</p>`;return}
  if(mode==="stock"){
    const x=S.find(s=>s.code===sel);const own=OWN[x.name]||[];
    d.innerHTML=`<div><span class="code">${x.code}・${x.mkt}</span><h2>${esc(x.name)}</h2><span class="tag">${esc(x.cat)}</span></div>
    <div class="kv"><div><small>收盤</small><b>${fmt(x.p)}</b></div><div><small>漲跌</small><b>${pct(x)}</b></div><div><small>成交值</small><b>${fmt(x.tv)} 億</b></div><div><small>股本</small><b>${fmt(x.cap,1)} 億</b></div><div><small>上市（櫃）</small><b>${x.yr||"—"}</b></div><div><small>ETF 持有</small><b>${own.length} 檔</b></div></div>
    <div class="jump"><a href="https://claude.ai/artifact/UNwf3YLPP6nXTWfRGVrPaw#${x.code}" target="_blank" rel="noopener">💰 看配息</a><a href="https://claude.ai/artifact/M9a9miXiw6A48VKovkJVqb#${x.code}" target="_blank" rel="noopener">🐷 模擬倉下單</a><a href="https://claude.ai/artifact/Vj54WYe91o3L2eYVQMpLDT#${x.code}" target="_blank" rel="noopener">✨ 問理專</a></div>
    ${finBlock(x.code)}
    <h3>哪些 ETF 持有它</h3>
    ${own.length?ownBars(own):`<p class="muted">已收錄內容物的 ${Object.keys(H).length} 檔 ETF 都沒有持有它。</p>`}
    <p class="note">比重是這檔股票占該 ETF 的百分比。只算已收錄內容物的 ETF，資料每週更新。</p>`;
  }else{
    const x=E.find(e=>e.code===sel),h=H[x.code];
    d.innerHTML=`<div><span class="code">${x.code}・${x.mkt}</span><h2>${esc(x.name)}</h2><span class="tag">${esc(x.cat)}</span></div>
    <div class="kv"><div><small>收盤</small><b>${fmt(x.p)}</b></div><div><small>漲跌</small><b>${pct(x)}</b></div><div><small>成交值</small><b>${fmt(x.tv)} 億</b></div></div>
    <div class="jump"><a href="https://claude.ai/artifact/UNwf3YLPP6nXTWfRGVrPaw#${x.code}" target="_blank" rel="noopener">💰 看配息</a><a href="https://claude.ai/artifact/M9a9miXiw6A48VKovkJVqb#${x.code}" target="_blank" rel="noopener">🐷 模擬倉下單</a><a href="https://claude.ai/artifact/Vj54WYe91o3L2eYVQMpLDT#${x.code}" target="_blank" rel="noopener">✨ 問理專</a></div>
    ${h?.d?`<p class="desc">${esc(h.d)}</p>`:""}
    ${h?.sec?.length?`<h3>${/北美|歐|亞|日本|新興|拉丁|紐澳/.test(h.sec.map(s=>s[0]).join(""))?"投資地區":"產業／資產分布"} <small class="muted">${h.sd||""}</small></h3>${bars(h.sec,"sec",false)}`:""}
    ${h?.h?.length?`<h3>持股明細 <small class="muted">${h.hd||""}・共 ${h.n} 檔${h.n>h.h.length?`，列出前 ${h.h.length} 大`:""}</small></h3>${bars(h.h,"",true)}`
      :x.cat==="槓桿反向"||x.cat==="商品期貨"?`<p class="note">這類 ETF 主要持有期貨、交換合約與現金，不是一籃子股票，所以沒有成分股清單。</p>`
      :`<p class="note">這檔的內容物還沒收錄，會在每週自動更新時補上。現在可以先到 <a href="${MDJ(x.code)}" target="_blank" rel="noopener">MoneyDJ 持股頁</a> 查看。</p>`}
    ${h?`<p class="muted" style="font-size:12.5px">國內股票型 ETF 每季公布全部持股；海外與債券 ETF 揭露的明細較少。<a href="${MDJ(x.code)}" target="_blank" rel="noopener">原始資料 →</a></p>`:""}`;
  }
}
$("t-stock").onclick=()=>setMode("stock");$("t-etf").onclick=()=>setMode("etf");
["q","mkt","sort"].forEach(id=>$(id).addEventListener("input",()=>{page=0;render()}));
$("cats").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;cat=b.dataset.c;page=0;render()});
$("pager").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;page+=+b.dataset.p;render();$("count").scrollIntoView({block:"nearest"})});
$("tbody").addEventListener("click",e=>{const tr=e.target.closest("tr[data-k]");if(!tr)return;sel=tr.dataset.k;render();detail();if(innerWidth<900)$("detail").scrollIntoView({behavior:"smooth"})});
$("detail").addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(!a)return;e.preventDefault();const [m,c]=a.dataset.go.split(":");if(m!==mode)setMode(m);sel=c;$("q").value="";cat="";
  const r=rows(),i=r.findIndex(x=>x.code===c);page=i<0?0:Math.floor(i/PER);render();detail();$("detail").scrollTop=0});
$("morecol").onclick=()=>{const on=$("tbl").classList.toggle("wide");$("morecol").setAttribute("aria-pressed",on);$("morecol").textContent=on?"收起欄位":"更多欄位"};
$("active").addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;const k=b.dataset.x;if(k==="q")$("q").value="";else if(k==="mkt")$("mkt").value="";else cat="";page=0;render()});
setMode("stock");
{const h=decodeURIComponent(location.hash.slice(1));const m=S.some(x=>x.code===h)?"stock":E.some(x=>x.code===h)?"etf":null;
 if(m){if(m!=="stock")setMode(m);sel=h;const r=rows(),i=r.findIndex(x=>x.code===h);page=i<0?0:Math.floor(i/PER);render();detail()}}
</script>
